language = "python"
extensions = ["py", "pyi"]
marker_comment_prefixes = ["#"]
test_paths = ["**/tests/**", "**/test/**", "**/test_*.py", "**/*_test.py"]
test_markers = ["def test_", "async def test_"]
assert_markers = ["assert", "self.assert"]
config_files = [
  "**/pyproject.toml",
  "**/setup.cfg",
  "**/mypy.ini",
  "**/pytest.ini",
  "**/tox.ini",
  "**/ruff.toml",
  "**/.ruff.toml",
  "**/.flake8",
  "**/.pre-commit-config.yaml",
  "**/.pre-commit-config.yml",
]

[[weakening]]
id = "pytest-mark"
contains = "@pytest.mark.skip"

[[weakening]]
id = "pytest-xfail"
contains = "@pytest.mark.xfail"

[[weakening]]
id = "unittest-skip"
contains = "@unittest.skip"

[[weakening]]
id = "unittest-expected-failure"
contains = "@unittest.expectedFailure"

[[weakening]]
id = "pytest-skip-call"
contains = "pytest.skip("
word_start = true

[[weakening]]
id = "type-ignore"
contains = "# type: ignore"

[[weakening]]
id = "noqa"
contains = "# noqa"

[[weakening]]
id = "no-cover"
contains = "# pragma: no cover"

# `pytestmark = pytest.mark.skip` skips a whole module without the `@`.
[[weakening]]
id = "pytest-mark-bare"
contains = "pytest.mark.skip"
word_start = true

[[weakening]]
id = "pytest-xfail-bare"
contains = "pytest.mark.xfail"
word_start = true

[[weakening]]
id = "skip-test-raise"
contains = "SkipTest("

[[weakening]]
id = "skip-test-method"
contains = ".skipTest("
