# Rules for Rust. `weakening` patterns run on added lines of files with one of
# `extensions`; a line that starts with a `comment_prefixes` entry is prose and
# is skipped. `test_markers` are counted per file: more removed than added is
# a deleted test. `test_paths` and `config_files` are globs on the repo-relative
# path.
language = "rust"
extensions = ["rs"]
comment_prefixes = ["//"]
ignore_in_strings = true
test_paths = ["**/tests/**", "**/tests.rs", "**/*_test.rs"]
test_markers = ["#[test]", "#[tokio::test", "#[proptest", "proptest!"]
assert_markers = ["assert", "debug_assert"]
config_files = [
  "**/clippy.toml",
  "**/.clippy.toml",
  "**/rustfmt.toml",
  "**/.rustfmt.toml",
  "**/deny.toml",
  "**/rust-toolchain.toml",
  "**/rust-toolchain",
  "**/.cargo/config.toml",
  "**/.cargo/config",
]

# Lines added to, or removed from, these sections of a manifest change what the
# compiler and clippy enforce.
[lint_tables]
files = ["Cargo.toml"]
sections = ["lints", "workspace.lints"]

[[weakening]]
id = "ignore"
contains = "#[ignore"
squeeze = true

[[weakening]]
id = "should-panic"
contains = "#[should_panic"
squeeze = true

[[weakening]]
id = "allow"
contains = "#[allow("
squeeze = true

[[weakening]]
id = "inner-allow"
contains = "#![allow("
squeeze = true

# A new `expect` may have a real reason. It is flagged so the lead reads the
# reason and waives it, or has it removed.
[[weakening]]
id = "expect"
contains = "#[expect("
squeeze = true

[[weakening]]
id = "inner-expect"
contains = "#![expect("
squeeze = true

# `#[cfg_attr(test, ignore)]` ignores a test without writing `#[ignore`. The
# attribute must be `ignore` itself, not a lint such as `ignored_unit_patterns`.
[[weakening]]
id = "cfg-attr-ignore"
contains = "cfg_attr("
and_contains = [", ignore)"]

[[weakening]]
id = "cfg-attr-ignore-eq"
contains = "cfg_attr("
and_contains = [", ignore ="]

[[weakening]]
id = "cfg-attr-ignore-tight"
contains = "cfg_attr("
and_contains = [",ignore"]

[[weakening]]
id = "cfg-attr-ignore-list"
contains = "cfg_attr("
and_contains = [", ignore,"]

# The same with spaces inside: `cfg_attr(test , ignore)`.
[[weakening]]
id = "cfg-attr-ignore-squeezed"
contains = "cfg_attr("
and_contains = [",ignore)"]
squeeze = true

[[weakening]]
id = "cfg-attr-ignore-eq-squeezed"
contains = "cfg_attr("
and_contains = [",ignore="]
squeeze = true

[[weakening]]
id = "cfg-attr-ignore-list-squeezed"
contains = "cfg_attr("
and_contains = [",ignore,"]
squeeze = true

# A cfg that is never true compiles the item out, so a test above it never runs.
[[weakening]]
id = "cfg-never"
contains = "#[cfg(any())]"
squeeze = true

[[weakening]]
id = "cfg-never-false"
contains = "#[cfg(FALSE)]"
squeeze = true

[[weakening]]
id = "cfg-never-not-all"
contains = "#[cfg(not(all()))]"
squeeze = true

[[weakening]]
id = "inner-cfg-never"
contains = "#![cfg(any())]"
squeeze = true

[[weakening]]
id = "inner-cfg-never-false"
contains = "#![cfg(FALSE)]"
squeeze = true

[[weakening]]
id = "inner-cfg-never-not-all"
contains = "#![cfg(not(all()))]"
squeeze = true
